services:
  api:
    image: ghcr.io/lbsa71/aurora-effect-api:${TAG:-latest}
    container_name: aurora-api-prod
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=https://aurora-effect.lbsa71.net
      - MAX_SIMULATIONS=10
      - UPDATE_INTERVAL_MS=100
    restart: unless-stopped
    networks:
      - aurora-network

  ui:
    image: ghcr.io/lbsa71/aurora-effect-ui:${TAG:-latest}
    container_name: aurora-ui-prod
    expose:
      - "80"
    environment:
      - VITE_API_URL=https://aurora-effect.lbsa71.net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aurora-network

  proxy:
    image: nginx:alpine
    container_name: aurora-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - aurora-ui-prod
      - aurora-api-prod
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - aurora-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aurora-tunnel-prod
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - proxy
    networks:
      - aurora-network

networks:
  aurora-network:
    driver: bridge