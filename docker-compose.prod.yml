services:
  app:
    image: ghcr.io/lbsa71/aurora-effect:${TAG:-latest}
    container_name: aurora-effect-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=*
      - MAX_SIMULATIONS=10
      - UPDATE_INTERVAL_MS=100
      - BASE_PATH=${BASE_PATH:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aurora-tunnel-prod
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy

networks:
  default:
    driver: bridge